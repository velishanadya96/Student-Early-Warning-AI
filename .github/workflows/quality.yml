name: Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  web:
    name: Frontend (Next.js, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (Flask, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
        env:
          APP_ENV: testing
      - name: Audit dependency (pip-audit)
        if: matrix.os == 'ubuntu-latest'
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Cek migrasi Alembic sinkron dengan model
        run: |
          flask --app run.py db upgrade
          flask --app run.py db check
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///ci.db

  vite:
    name: Modul 8 (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modul-8-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modul-8-vite/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker (build semua image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env contoh
        run: |
          printf 'MYSQL_ROOT_PASSWORD=ci-password\nJWT_SECRET_KEY=%s\nSEED_PASSWORD=ci-seed-password\n' "$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" > .env
      - run: docker compose config --quiet
      - name: Validasi compose production
        run: |
          printf 'DOMAIN=localhost\nMYSQL_ROOT_PASSWORD=ci-root\nMYSQL_APP_PASSWORD=ci-app\nMAIL_HOST=smtp.invalid\nMAIL_FROM=ci@localhost\n' >> .env
          docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose build
      - name: Jalankan stack dan uji kesehatan
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if docker compose exec -T api python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')" 2>/dev/null; then break; fi
            sleep 3
          done
          docker compose exec -T api python seed.py
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused -s -o /dev/null http://127.0.0.1:3000/login
          docker compose exec -T api python -c "import urllib.request,json;r=urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health');print(r.read())"
      - if: failure()
        run: docker compose logs --no-color | tail -80
